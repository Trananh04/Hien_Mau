# Cấu hình CHẠY THẬT (khác docker-compose.yml dùng cho dev):
#   - Caddy nhận HTTPS (tự cấp chứng chỉ Let's Encrypt cho SITE_DOMAIN), chuyển vào gunicorn
#   - không pgAdmin, không mount mã nguồn, không --reload, chạy bằng user `app` (Dockerfile)
#   - PostgreSQL tinh chỉnh theo RAM máy chủ (biến PG_*), không mở cổng DB ra ngoài
#   - mô hình dự báo lưu ở volume `forecast` dùng chung web + scheduler
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# .env.prod tối thiểu: SITE_DOMAIN, DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_CSRF_TRUSTED_ORIGINS (https://…),
# POSTGRES_PASSWORD, GOONG_*, OLLAMA_*. Giá trị PG_* mặc định cho máy chủ ~4 GB RAM: shared_buffers ≈ 25% RAM,
# effective_cache_size ≈ 50–75% RAM.
name: hien-mau-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hien_mau}
      POSTGRES_USER: ${POSTGRES_USER:-hienmau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env.prod}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=1.1          # ổ SSD
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.12.3}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama:/root/.ollama

  web:
    build: ./backend
    restart: unless-stopped
    # Python chạy mỗi worker trên ~1 nhân (GIL) → WEB_WORKERS ≈ số nhân CPU dành cho web. Đo trên staging 16 nhân:
    # 3×8 luồng bão hòa ở ~75 req/s (web ~3 nhân), 8×4 luồng đạt ~137 req/s, p95 < 1 s ở 50 người dùng đồng thời.
    # Mỗi worker ~85 MB RAM; luồng (gthread) để request chờ AI / dịch vụ ngoài không chặn trang khác.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${WEB_WORKERS:-4}",
              "--worker-class", "gthread", "--threads", "${WEB_THREADS:-4}", "--timeout", "120",
              "--access-logfile", "-"]
    env_file:
      - .env.prod
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS: "1"
      TRUSTED_PROXY_COUNT: "1"       # 1 lớp proxy (Caddy) → lấy đúng IP người dùng cho giới hạn tần suất / nhật ký
      SEED_DEMO: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FORECAST_MODEL_DIR: /app/var/forecast
    expose:
      - "8000"
    volumes:
      - forecast:/app/var/forecast
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: ["python", "manage.py", "run_jobs", "--loop", "${JOBS_INTERVAL_SECONDS:-300}"]
    env_file:
      - .env.prod
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FORECAST_MODEL_DIR: /app/var/forecast
    volumes:
      - forecast:/app/var/forecast
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Đặt SITE_DOMAIN (tên miền trỏ về máy chủ) trong .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  ollama:
  forecast:
  caddy_data:
  caddy_config:
