# Cấu hình CHẠY THẬT (khác docker-compose.yml dùng cho dev):
#   - Cloudflare Tunnel (cloudflared) kết nối RA Cloudflare → không cần IP công khai / mở cổng router;
#     Cloudflare lo HTTPS, cloudflared → nginx (nén, giới hạn upload, IP thật) → gunicorn
#   - không pgAdmin, không mount mã nguồn, không --reload, chạy bằng user `app` (Dockerfile)
#   - PostgreSQL tinh chỉnh theo RAM máy chủ (biến PG_*), không mở cổng DB ra ngoài
#   - mô hình dự báo lưu ở volume `forecast` dùng chung web + scheduler
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml up -d --build   (bỏ -f …gpu.yml nếu máy không có
#   card NVIDIA — trợ lý AI chạy CPU rất chậm; dùng chung .env với dev, DEBUG/SEED_DEMO bị ghi đè bên dưới)
#   Mô hình AI tải 1 lần: docker compose -f docker-compose.prod.yml exec ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
#
# Trong Cloudflare (Networks → Tunnels → tunnel → Public hostnames): gothong.online, www.gothong.online → HTTP nginx:80.
#
# .env cần thêm: TUNNEL_TOKEN, tên miền trong DJANGO_ALLOWED_HOSTS + DJANGO_CSRF_TRUSTED_ORIGINS (https://…); đổi DJANGO_SECRET_KEY,
# POSTGRES_PASSWORD, GOONG_*, OLLAMA_*. Giá trị PG_* mặc định cho máy chủ ~4 GB RAM: shared_buffers ≈ 25% RAM,
# effective_cache_size ≈ 50–75% RAM.
name: hien-mau-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hien_mau}
      POSTGRES_USER: ${POSTGRES_USER:-hienmau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-3GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - random_page_cost=1.1          # ổ SSD
      - -c
      - max_connections=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.12.3}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama:/root/.ollama

  web:
    build: ./backend
    restart: unless-stopped
    # Python chạy mỗi worker trên ~1 nhân (GIL) → WEB_WORKERS ≈ số nhân CPU dành cho web. Đo trên staging 16 nhân:
    # 3×8 luồng bão hòa ở ~75 req/s (web ~3 nhân), 8×4 luồng đạt ~137 req/s, p95 < 1 s ở 50 người dùng đồng thời.
    # Mỗi worker ~85 MB RAM; luồng (gthread) để request chờ AI / dịch vụ ngoài không chặn trang khác.
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "${WEB_WORKERS:-4}",
              "--worker-class", "gthread", "--threads", "${WEB_THREADS:-4}", "--timeout", "120",
              "--access-logfile", "-"]
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS: "1"
      TRUSTED_PROXY_COUNT: "1"       # nginx ghi đúng 1 IP (CF-Connecting-IP) → IP người dùng cho giới hạn tần suất / nhật ký
      SEED_DEMO: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FORECAST_MODEL_DIR: /app/var/forecast
    expose:
      - "8000"
    volumes:
      - forecast:/app/var/forecast
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    restart: unless-stopped
    command: ["python", "manage.py", "run_jobs", "--loop", "${JOBS_INTERVAL_SECONDS:-300}"]
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      FORECAST_MODEL_DIR: /app/var/forecast
    volumes:
      - forecast:/app/var/forecast
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    # Không mở cổng ra máy host: chỉ cloudflared trong mạng Docker gọi vào
    expose:
      - "80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  cloudflared:
    image: cloudflare/cloudflared:2026.10.4
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Đặt TUNNEL_TOKEN (Cloudflare → Networks → Tunnels) trong .env}
    depends_on:
      - nginx

volumes:
  pgdata:
  ollama:
  forecast:
