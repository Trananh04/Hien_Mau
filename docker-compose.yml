name: hien-mau

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hien_mau}
      POSTGRES_USER: ${POSTGRES_USER:-hienmau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hienmau_dev_pw}
      TZ: UTC
    ports:
      # Chỉ mở cho chính máy này (máy khác trong mạng LAN không kết nối DB được)
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8.14
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@hienmau.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      # pgAdmin chạy chế độ không đăng nhập → chỉ mở cho chính máy này
      - "127.0.0.1:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # Mô hình AI chạy tại chỗ cho trợ lý hỏi đáp: dữ liệu không rời máy chủ. Không mở cổng ra ngoài — chỉ service
  # web/scheduler gọi được qua mạng nội bộ Docker (http://ollama:11434). Mô hình tải MỘT lần vào volume `ollama`:
  #   docker compose exec ollama ollama pull qwen3:4b-instruct-2507-q4_K_M
  # Có card NVIDIA: chạy thêm docker-compose.gpu.yml (xem README).
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.12.3}
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}       # card nhỏ: xử lý từng câu, câu khác chuyển chế độ từ khóa
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # Card nhỏ: flash attention + nén bộ nhớ ngữ cảnh (KV cache) → cả mô hình 4B nằm gọn trong 4 GB VRAM
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  web:
    build: ./backend
    restart: unless-stopped
    # Dev: mount mã nguồn từ máy + tự nạp lại khi sửa code. Image dùng khi triển khai chạy user `app`, không --reload;
    # riêng dev chạy root vì thư mục mount (staticfiles/) thuộc quyền máy host.
    user: root
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--worker-class", "gthread", "--threads", "8", "--timeout", "120", "--reload", "--access-logfile", "-"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${WEB_HOST_PORT:-8080}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  # Tác vụ định kỳ: hết hạn yêu cầu liên viện, tự hủy đề nghị quá hạn, nhắc yêu cầu cần máu chưa xác minh
  scheduler:
    build: ./backend
    restart: unless-stopped
    user: root  # dev: mount mã nguồn từ máy (xem service web)
    command: ["python", "manage.py", "run_jobs", "--loop", "${JOBS_INTERVAL_SECONDS:-300}"]
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  pgdata:
  pgadmin:
  ollama:
