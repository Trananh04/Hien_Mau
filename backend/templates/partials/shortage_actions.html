{# Hành động từ một dòng thiếu hụt (s): xin hỗ trợ liên viện · tạo đợt hiến · kêu gọi người hiến cùng nhóm ở gần. #}
<div class="table-actions">
  <a class="btn primary sm" href="{% url 'bloodbank:source_search' %}?blood_group={{ s.blood_group|urlencode }}&product={{ s.spec.product_id }}&spec={{ s.spec.pk }}&qty={{ s.shortage }}">{% icon "send" %} Xin hỗ trợ</a>
  <a class="btn secondary sm" href="{% url 'bloodbank:hospital_campaign_create' %}?blood_group={{ s.blood_group|urlencode }}">{% icon "calendar-plus" %} Tạo đợt hiến</a>
  <form method="post" action="{% url 'bloodbank:donor_callout' %}" class="inline-form"
        data-confirm="Gửi lời kêu gọi tới {{ s.callout_count }} người hiến nhóm {{ s.blood_group }}?"
        data-confirm-detail="Người nhận: người dùng cùng tỉnh/thành, nhóm máu tự khai {{ s.blood_group }}, đã đủ thời gian nghỉ giữa 2 lần hiến. Bạn không xem được danh sách người nhận.{% if s.last_callout %} Lần kêu gọi gần nhất: {{ s.last_callout.created_at|vn_dt }}.{% endif %}"
        data-confirm-label="Gửi lời kêu gọi">
    {% csrf_token %}<input type="hidden" name="blood_group" value="{{ s.blood_group }}"><input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button class="btn secondary sm" {% if not s.callout_count %}disabled title="Chưa có người dùng phù hợp"{% endif %}>{% icon "megaphone" %} Kêu gọi ({{ s.callout_count }})</button>
  </form>
</div>
