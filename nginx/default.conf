# Reverse proxy chạy thật (docker-compose.prod.yml): cloudflared → nginx → gunicorn.
# Không mở cổng ra máy host — chỉ cloudflared trong mạng Docker gọi được, Cloudflare lo HTTPS ở phía ngoài.

upstream django {
    server web:8000;
    keepalive 16;
}

# IP người dùng: Cloudflare ghi vào CF-Connecting-IP. Chỉ tin header này từ mạng nội bộ Docker (cloudflared).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

# Cloudflare gửi X-Forwarded-Proto: https; gọi thẳng nginx (kiểm tra nội bộ) thì dùng scheme thật
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Ghi ĐÈ (không nối thêm) → Django nhận đúng 1 IP, khớp TRUSTED_PROXY_COUNT=1
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Khớp --timeout 120 của gunicorn (trợ lý AI trả lời chậm)
        proxy_read_timeout 120s;
        # Trợ lý hỏi đáp (SSE) tự gửi X-Accel-Buffering: no → nginx đẩy từng phần ngay
    }
}
